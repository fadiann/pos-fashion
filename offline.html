<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKPOS — Sedang Offline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full text-center bg-slate-800/80 backdrop-blur border border-slate-700 rounded-3xl p-8 shadow-2xl">
        <div class="w-20 h-20 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl">
            <i class="fa-solid fa-wifi-slash"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Koneksi Internet Terputus</h1>
        <p class="text-slate-400 text-sm mb-6 leading-relaxed">
            Aplikasi HKPOS membutuhkan koneksi jaringan untuk sinkronisasi transaksi kasir dan persediaan database realtime.
        </p>
        <button onclick="window.location.reload()" class="w-full py-3.5 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-semibold transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30">
            <i class="fa-solid fa-rotate-right"></i>
            Coba Sambungkan Lagi
        </button>
    </div>
</body>
</html>
